version: '3'

services:
  hotels_db:
    image: postgres:16.3
    container_name: hotels_db_container
    shm_size: 128mb
    ports:
      - '5436:5432' # Пробрасываем порт для доступа к базе данных
    env_file:
      - .env-non-dev
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - ./data:/var/lib/postgresql/data # Монтируем volume в текущую директорию в папку data
    networks:
      - hotels_network

  redis:
    image: redis:7
    container_name: redis_container
    env_file:
      - .env-non-dev
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_USER=${REDIS_USER}
      - REDIS_USER_PASSWORD=${REDIS_USER_PASSWORD}
    ports:
      - '6380:6379'
    volumes:
      - ./redisdata:/data
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    command: >
      sh -c '
        mkdir -p /usr/local/etc/redis &&
        echo "bind 0.0.0.0" > /usr/local/etc/redis/redis.conf &&
        echo "requirepass $REDIS_PASSWORD" >> /usr/local/etc/redis/redis.conf &&
        echo "appendonly yes" >> /usr/local/etc/redis/redis.conf &&
        echo "appendfsync everysec" >> /usr/local/etc/redis/redis.conf &&
        echo "user default on nopass ~* +@all" > /usr/local/etc/redis/users.acl &&
        echo "user $REDIS_USER on >$REDIS_USER_PASSWORD ~* &* +@ALL" >> /usr/local/etc/redis/users.acl &&
        redis-server /usr/local/etc/redis/redis.conf --aclfile /usr/local/etc/redis/users.acl
      '
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '$REDIS_PASSWORD', 'ping']
      interval: 30s
      timeout: 10s
      retries: 5
    tty: true
    stdin_open: true
    networks:
      - hotels_network

  booking:
    container_name: booking_app
    build:
      context: . # Путь к Dokerfile. Сейчас указана текущая директория
    env_file:
      - .env-non-dev
    depends_on:
      - hotels_db
      - redis
    command: ['/bin/bash', '/booking/docker/app.sh'] # Путь к расположению файла в WORKDIR
    ports:
      - 7777:8000
    networks:
      - hotels_network

  celery:
    container_name: booking_celery
    build:
      context: .
    command: ['/bin/bash', '/booking/docker/celery.sh', 'celery']
    env_file:
      - .env-non-dev
    depends_on:
      - redis
    networks:
      - hotels_network

  flower:
    container_name: booking_flower
    build:
      context: .
    command: ['/bin/bash', '/booking/docker/celery.sh', 'flower']
    env_file:
      - .env-non-dev
    depends_on:
      - redis
    networks:
      - hotels_network

networks:
  hotels_network:
    driver: bridge
