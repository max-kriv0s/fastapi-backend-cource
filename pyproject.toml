[tool.poetry]
name = "погружение в backend разработку на fastapi"
version = "0.1.0"
description = ""
authors = ["Maxim Krivoshein <max.kriv0s@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.13"
fastapi = "^0.115.6"
uvicorn = "^0.34.0"
sqlalchemy = "^2.0.36"
alembic = "^1.14.0"
asyncpg = "^0.30.0"
greenlet = "^3.1.1"
pydantic-settings = "^2.7.1"
pydantic = {extras = ["email"], version = "^2.10.4"}
passlib = "^1.7.4"
bcrypt = "^4.2.1"
python-jose = "^3.3.0"
mypy = "^1.14.1"
jinja2 = "^3.1.5"
python-multipart = "^0.0.20"
redis = "^5.2.1"
celery = "^5.4.0"
flower = "^2.0.1"
pillow = "^11.1.0"
sqladmin = "^0.20.1"
itsdangerous = "^2.2.0"
pytest-asyncio = "^0.25.3"
httpx = "^0.28.1"
black = "^25.1.0"
flake8 = "^7.1.1"
autoflake = "^2.3.1"
isort = "^6.0.0"
pyright = "^1.1.393"
python-json-logger = "^3.2.1"
fastapi-versioning = "^0.10.0"
gunicorn = "^23.0.0"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ['py313']

[tool.isort]
profile = "black"
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
line-length = 88

[tool.autoflake]
check_diff = true
imports = ["sqlalchemy", "app", "fastapi"]

[tool.pyrigth]
include = ["app"]